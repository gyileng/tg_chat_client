name: Windows checks and portable package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Resolve dependencies
        shell: pwsh
        run: |
          if (Test-Path uv.lock) { uv sync --locked } else { uv sync }
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Build directory bundle
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging/tg-chat-client.spec
      - name: Smoke test bundled executable
        shell: pwsh
        run: |
          $smokeData = Join-Path $env:RUNNER_TEMP 'tg-chat-smoke'
          $process = Start-Process -FilePath dist/TGChatClient/TGChatClient.exe -ArgumentList @('--mock', '--smoke-test', '--data-dir', "`"$smokeData`"") -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Portable startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Portable startup failed: $($process.ExitCode)" }
      - name: Bundle usage instructions
        shell: pwsh
        run: |
          Copy-Item packaging/使用说明.txt dist/TGChatClient/使用说明.txt
          Compress-Archive -Path dist/TGChatClient -DestinationPath dist/TGChatClient-windows-x64.zip
      - name: Measure offline five-account workload
        run: uv run --no-sync python scripts/benchmark.py --output dist/performance-after.json --package dist/TGChatClient-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TGChatClient-windows-x64
          path: |
            dist/TGChatClient-windows-x64.zip
            dist/performance-after.json
            uv.lock
          retention-days: 14
